apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: paydesmond/payments
          env:
            - name: NATS_URL
              value: "http://nats-srv:4222"
            - name: MONGO_URI
              value: "mongodb://payments-mongo-srv:27017/payments"
            - name: JWT_KEY
              value: "12345"
            - name: STRIPE_KEY
              valueFrom:
                secretKeyRef: 
                  name: stripe-secret
                  key: STRIPE_KEY 
            - name: PAYSTACK_KEY
              valueFrom:
                secretKeyRef: 
                  name: paystack-secret
                  key: PAYSTACK_KEY 
---
apiVersion: v1
kind: Service
metadata:
  name: payments-srv
spec:
  type: ClusterIP
  selector:
    app: payments
  ports:
    - name: payments
      protocol: TCP
      port: 3000
      targetPort: 3000
